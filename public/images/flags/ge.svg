    <rect x="147" y="69" width="18" height="60" />
    <rect x="534" y="90" width="60" height="18" />
    <rect x="555" y="69" width="18" height="60" />
    <rect x="126" y="372" width="60" height="18" />
    <rect x="147" y="351" width="18" height="60" />
    <rect x="534" y="372" width="60" height="18" />
    <rect x="555" y="351" width="18" height="60" />
