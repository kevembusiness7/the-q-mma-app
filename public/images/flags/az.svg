<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <!-- Bandeira do Azerbaijão: três faixas horizontais (azul, vermelho, verde)
       com crescente e estrela brancos centrados na faixa vermelha. Como
       marca d'água atrás da foto, a estrela de 8 pontas vira um losango
       simples, do mesmo jeito que as outras bandeiras deste conjunto
       simplificam os detalhes pequenos. -->
  <rect width="720" height="360" fill="#0092bc"/>
  <rect y="120" width="720" height="120" fill="#ef3340"/>
  <rect y="240" width="720" height="120" fill="#509e2f"/>
  <circle cx="330" cy="180" r="46" fill="#ffffff"/>
  <circle cx="346" cy="180" r="46" fill="#ef3340"/>
  <rect x="392" y="164" width="22" height="22" fill="#ffffff" transform="rotate(45 403 175)"/>
</svg>
